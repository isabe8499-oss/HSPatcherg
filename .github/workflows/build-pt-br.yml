name: Build HSPatcher APK (Português Brasil)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        shell: pwsh
        run: |
          $sdk = "$env:LOCALAPPDATA\Android\Sdk"
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          $sdkmanager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (!(Test-Path $sdkmanager)) {
            $toolsZip = "$env:RUNNER_TEMP\cmdline-tools.zip"
            Invoke-WebRequest "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile $toolsZip
            $tmp = "$env:RUNNER_TEMP\cmdline-tools"
            Expand-Archive $toolsZip -DestinationPath $tmp -Force
            New-Item -ItemType Directory -Force (Join-Path $sdk "cmdline-tools") | Out-Null
            Move-Item (Join-Path $tmp "cmdline-tools") (Join-Path $sdk "cmdline-tools\latest") -Force
          }
          1..10 | ForEach-Object { "y" } | & $sdkmanager --sdk_root="$sdk" "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }
      - name: Enable PowerShell 7
        shell: pwsh
        run: |
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw "PowerShell 7 is not available on runner" }
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Prepare temporary CI signing key
        shell: pwsh
        run: |
          if (!(Test-Path "hspatcher.jks")) {
            keytool -genkeypair -noprompt -keystore "hspatcher.jks" -storepass "ci-temporary-password" -keypass "ci-temporary-password" -alias "hspatcher" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HSPatcher CI, OU=Build, O=HSPatcher, C=BR"
          }
      - name: Build APK
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Clean
      - name: Verify APK and upload
        shell: pwsh
        run: |
          $apk = "build\HSPatcher.apk"
          if (!(Test-Path $apk)) { throw "Expected APK was not created: $apk" }
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT "build-tools\36.1.0\apksigner.bat"
          & $apksigner verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed" }
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSPatcher-pt-BR-debug
          path: build/HSPatcher.apk
          if-no-files-found: error
          retention-days: 14
